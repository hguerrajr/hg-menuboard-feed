<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HG Menu Board</title>
</head>
<body>
<video id="v" autoplay muted loop playsinline width="100%" height="100%"></video>
<script>
// Plain player, no CSS: plays the first video in the "warr-lg" list and loops it.
// Checks the playlist every 5 minutes and switches if the video changed.
var FEED = "../menu.json", SCREEN = "warr-lg", current = "";
function load(){
  var x = new XMLHttpRequest();
  x.open("GET", FEED + "?t=" + Date.now());
  x.onload = function(){
    try {
      var list = JSON.parse(x.responseText).screens[SCREEN];
      var url = list && list[0] && list[0].url;
      if (url && url !== current) {
        current = url;
        var v = document.getElementById("v");
        v.src = url; v.play();
      }
    } catch(e){}
  };
  x.send();
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
