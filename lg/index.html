<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HG Menu Board</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .8s linear;background:#000}
  .layer.on{opacity:1}
  /* Screen mounted tall but the box outputs wide: turn everything 90° to the left so it fills upright. */
  #stage{position:absolute;top:50%;left:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(-90deg);overflow:hidden}
  #stage .layer{object-fit:cover}
  #msg{position:absolute;left:24px;bottom:20px;color:#888;font:16px sans-serif}
</style>
</head>
<body>
<div id="stage">
<img id="a" class="layer" alt="">
<img id="b" class="layer" alt="">
<video id="v" class="layer" muted playsinline preload="auto"></video>
<div id="msg"></div>
</div>
<script>
// HG Menu Board web player. Same playlist as the TVs: play.html?screen=<list name>
// Images use "duration" (seconds, default from the file); videos play to the end.
var FEED = "../menu.json";
var screenId = (location.search.match(/[?&]screen=([^&]+)/) || [])[1] || "warr-lg";
screenId = decodeURIComponent(screenId);
var slides = [], idx = -1, def = 15, timer = null, front = "a", lastJson = "";

function $(id){ return document.getElementById(id); }
function say(t){ $("msg").textContent = t || ""; }

function load(){
  var x = new XMLHttpRequest();
  x.open("GET", FEED + "?t=" + Date.now());
  x.onload = function(){
    try {
      var d = JSON.parse(x.responseText);
      var list = (d.screens && d.screens[screenId]) || d.slides;
      if (!list || !list.length) { say("No slides for screen '" + screenId + "'"); return; }
      var j = JSON.stringify(list);
      try { localStorage.setItem("hg-" + screenId, JSON.stringify({l: list, d: d.defaultDuration})); } catch(e){}
      if (j !== lastJson) { lastJson = j; slides = list; def = d.defaultDuration || 15; idx = -1; say(""); next(); }
    } catch(e) { say("Playlist error"); }
  };
  x.onerror = function(){ if (!slides.length) fromCache(); };
  x.send();
}

function fromCache(){
  try {
    var c = JSON.parse(localStorage.getItem("hg-" + screenId));
    if (c && c.l) { slides = c.l; def = c.d || 15; lastJson = JSON.stringify(c.l); next(); }
  } catch(e){}
}

function next(){
  clearTimeout(timer);
  if (!slides.length) return;
  idx = (idx + 1) % slides.length;
  var s = slides[idx], v = $("v");
  if ((s.type || "image").toLowerCase() === "video") {
    v.src = s.url; v.onended = next; v.onerror = function(){ timer = setTimeout(next, 2000); };
    var p = v.play(); if (p && p.catch) p.catch(function(){ timer = setTimeout(next, 2000); });
    v.className = "layer on"; $("a").className = "layer"; $("b").className = "layer";
    if (slides.length === 1) v.loop = true;
    return;
  }
  v.pause(); v.className = "layer"; v.loop = false;
  var back = front === "a" ? "b" : "a", img = $(back);
  img.onload = function(){
    img.className = "layer on"; $(front).className = "layer"; front = back;
    timer = setTimeout(next, (s.duration || def) * 1000);
  };
  img.onerror = function(){ timer = setTimeout(next, 2000); };
  img.src = s.url;
}

fromCache();
load();
setInterval(load, 5 * 60 * 1000);       // check for playlist changes every 5 minutes
setTimeout(function(){ location.reload(); }, 24 * 3600 * 1000); // fresh start once a day
</script>
</body>
</html>
